#ddev-generated
# Configuration for OpenAI Codex CLI addon
# Documentation: https://github.com/ddev/ddev-codex

# Uncomment and set your OpenAI API key here, or use .ddev/.env
# web_environment:
#   - OPENAI_API_KEY=sk-your-api-key-here

hooks:
  post-start:
    - exec: |
        # Ensure the persistent mount point exists and has correct permissions
        mkdir -p /mnt/codex-config
        chmod 755 /mnt/codex-config
        # Remove any stale symlink or empty directory, then create symlink
        if [ -L "$HOME/.codex" ]; then
          rm -f "$HOME/.codex"
        elif [ -d "$HOME/.codex" ] && [ -z "$(ls -A "$HOME/.codex" 2>/dev/null)" ]; then
          rmdir "$HOME/.codex"
        fi
        # Create symlink from ~/.codex -> /mnt/codex-config (the persistent bind mount)
        if [ ! -e "$HOME/.codex" ]; then
          ln -sf /mnt/codex-config "$HOME/.codex"
        fi
